[project]
name = "cycling-coach"
version = "0.1.0"
description = "Analysis layer that turns Intervals.icu data into coaching insight, fueling plans and benchmarks"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
# httpx is required by fastapi.testclient, so the web tests need it even though
# the app itself does not import it directly.
dev = ["pytest>=8.0", "httpx>=0.27"]
web = ["fastapi>=0.110", "uvicorn>=0.27", "jinja2>=3.1"]

[project.scripts]
coach = "cycling_coach.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cycling_coach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
